name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  general:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # Lowest SDK the pubspec promises, plus the current stable
        sdk: ["3.10.3", "stable"]

    defaults:
      run:
        working-directory: ./freezed_factories

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Print Dart SDK version
        run: dart --version

      - name: Install dependencies
        run: dart pub get

      - name: Check Formatting
        run: dart format --line-length 80 --set-exit-if-changed $(find lib test -name '*.dart' -not -name 'generate_example_golden.dart')

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: dart test

  example:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        sdk: ["3.10.3", "stable"]

    defaults:
      run:
        working-directory: ./freezed_factories/example

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Print Dart SDK version
        run: dart --version

      - name: Install dependencies
        run: dart pub get

      - name: Build
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: dart test
